<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPI checkout demo</title>
<style>
  :root { color-scheme: light dark; --bg: #f8fafc; --card: #fff; --fg: #0f172a; --mut: #64748b; --line: #e2e8f0; --c: #4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #020617; --card: #0f172a; --fg: #f1f5f9; --mut: #94a3b8; --line: #1e293b; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: var(--mut); font-size: 14px; }
  label { font-size: 13px; font-weight: 600; }
  input { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 0 12px; font-size: 16px; }
  button { height: 48px; border: 0; border-radius: 12px; background: var(--c); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
  .ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  pre { margin: 0; padding: 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font-size: 12px; overflow: auto; max-height: 220px; }
  .note { font-size: 12.5px; }
</style>
</head>
<body>
  <div class="card">
    <h1>UPI checkout demo</h1>
    <p>Test mode: no real money. Start a payment, then press <b>Simulate the bank alert</b> in the checkout to see it confirm.</p>
    <label for="amt">Amount (₹)</label>
    <input id="amt" type="number" min="1" step="1" value="499">
    <button id="pay" type="button">Pay with UPI</button>
    <pre id="out">Events show here.</pre>
    <p class="note">In your own site: load <code>/upi/checkout.js</code> and call <code>UpiCheckout.open({ endpoint, paymentId })</code>.</p>
  </div>
  <script src="/upi/checkout.js"></script>
  <script>
    var out = document.getElementById('out');
    function log(t, d) { out.textContent = t + (d ? '\n' + JSON.stringify(d, null, 2) : '') + '\n\n' + out.textContent; }
    document.getElementById('pay').onclick = function () {
      UpiCheckout.open({
        endpoint: '/upi', amount: Number(document.getElementById('amt').value), orderId: 'DEMO-' + Date.now(),
        onPaid: function (p) { log('paid', { id: p.id, paidAmount: p.paidAmount, utr: p.utr }); },
        onClose: function (p) { log('closed', p && { id: p.id, status: p.status }); }
      });
    };
  </script>
</body>
</html>
